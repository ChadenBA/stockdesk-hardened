# StockDesk CI/CD (hardened). The reasoning behind each control is in RISKS.md.
#
# Pull requests (from branches or forks): tests, static checks and an image
#   build + scan. They run with a read-only token and NO secrets.
# Push to main: the same, then publish the exact image that was scanned and
#   deploy it by digest, through the "test" environment (which holds the
#   secrets and, if the GitHub plan allows it, requires a reviewer).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Deny everything by default; each job asks only for what it needs.
permissions: {}

# Explicit bash => "bash -eo pipefail": a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  REGISTRY: registry.corvane.example
  IMAGE: stockdesk

jobs:
  checks:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Install pinned scanners (SHA-256 verified)
        run: ci/install-tools.sh actionlint hadolint kubeconform gitleaks trivy

      - name: Secret scan (files in this commit)
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml .

      - name: Lint the workflows
        run: actionlint

      - name: Lint the Dockerfile
        run: hadolint Dockerfile

      - name: Validate Kubernetes manifests against the API schemas
        run: kubeconform -strict -summary k8s/

      - name: Misconfiguration scan (Dockerfile, Kubernetes)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml .

  image:
    name: Build and scan the image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned trivy (SHA-256 verified)
        run: ci/install-tools.sh trivy

      - name: Build
        run: >-
          docker build --pull
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          -t "stockdesk:${GITHUB_SHA}" .

      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "stockdesk:${GITHUB_SHA}"

      - name: Generate the SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json "stockdesk:${GITHUB_SHA}"

      - name: Keep the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Save the scanned image for the release job
        if: github.event_name == 'push'
        run: docker save "stockdesk:${GITHUB_SHA}" | gzip > image.tar.gz

      - name: Hand the image to the release job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish and deploy to the test cluster
    needs: image
    # Only trusted code (main, after review) ever reaches the secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # DEPLOY_TOKEN and KUBECONFIG are secrets of this environment, restricted
    # to the main branch (and to required reviewers if the plan allows it).
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out (for the manifests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load the image
        run: gunzip -c image.tar.gz | docker load

      - name: Push the image and record its digest
        id: push
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          printf '%s' "$DEPLOY_TOKEN" | docker login "$REGISTRY" -u ci-bot --password-stdin
          ref="$REGISTRY/$IMAGE:$GITHUB_SHA"
          docker tag "stockdesk:$GITHUB_SHA" "$ref"
          docker push "$ref"
          # Ask the registry which digest it stored. TODO verify this format on the runner.
          digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $digest" >&2; exit 1; }
          echo "image=$REGISTRY/$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Log out of the registry
        if: always()
        run: docker logout "$REGISTRY"

      - name: Deploy by digest
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          IMAGE_REF: ${{ steps.push.outputs.image }}
        run: |
          # Refuse anything but "<registry>/<image>@sha256:<64 hex>" (never a tag, never empty).
          [[ "$IMAGE_REF" == "$REGISTRY/$IMAGE@sha256:"* && "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]] \
            || { echo "refusing to deploy, bad image reference: '$IMAGE_REF'" >&2; exit 1; }
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG"
          sed "s|registry.corvane.example/stockdesk:set-by-ci|${IMAGE_REF}|" k8s/deployment.yaml > "$RUNNER_TEMP/deployment.yaml"
          grep -q "image: ${IMAGE_REF}\$" "$RUNNER_TEMP/deployment.yaml"
          # Namespace, RBAC and the Secret are created by an admin (k8s/admin/, README), never by CI.
          kubectl apply -f "$RUNNER_TEMP/deployment.yaml" -f k8s/networkpolicy.yaml
          kubectl -n stockdesk rollout status deployment/stockdesk --timeout=180s

      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
