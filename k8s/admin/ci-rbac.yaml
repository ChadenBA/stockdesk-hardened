# Applied ONCE by a cluster admin. Replaces the contractor's KUBECONFIG (whose
# rights are unknown, possibly cluster-admin) with an identity that can only
# deploy StockDesk in its own namespace. No access to Secrets, no delete, no
# other namespace. The admin then builds a kubeconfig for this ServiceAccount
# and stores it as the KUBECONFIG secret of the GitHub "test" environment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: stockdesk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: stockdesk
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]           # read by "kubectl rollout status"
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: stockdesk
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: stockdesk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
